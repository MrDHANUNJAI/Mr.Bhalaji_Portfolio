<style>/* RESET */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

/* BODY */

body{

    background:
    linear-gradient(
    to bottom,
    #081120,
    #111827
    );

    color:white;

    overflow-x:hidden;
}

/* BACKGROUND GLOW */

.bg-glow{

    position:fixed;

    width:500px;
    height:500px;

    background:
    rgba(0,200,255,0.15);

    filter:blur(120px);

    top:-100px;
    right:-100px;

    z-index:-1;
}

/* PAGE */

.gallery-page{

    padding:80px 7%;
}

/* TITLE */

.gallery-title{

    text-align:center;

    font-size:52px;

    margin-bottom:60px;

    font-weight:600;
}

/* GALLERY GRID */

.gallery-container{

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(280px,1fr));

    grid-auto-rows:250px;

    gap:25px;
}

/* CARD */

.gallery-card{

    position:relative;

    overflow:hidden;

    border-radius:22px;

    cursor:pointer;

    transition:0.5s ease;

    background:#111827;

    animation:fadeUp 1s ease forwards;
}

/* IMAGE */

.gallery-card img{

    width:100%;
    height:100%;

    object-fit:cover;

    transition:0.6s ease;
}

/* HOVER EFFECT */

.gallery-card:hover{

    transform:
    translateY(-10px)
    scale(1.02);

    box-shadow:
    0 15px 40px rgba(0,0,0,0.45);
}

/* IMAGE ZOOM */

.gallery-card:hover img{

    transform:scale(1.08);
}

/* DIFFERENT SIZES */

.tall{

    grid-row:span 2;
}

.wide{

    grid-column:span 2;
}

/* MODAL */

.modal{

    display:none;

    position:fixed;

    z-index:999;

    left:0;
    top:0;

    width:100%;
    height:100%;

    background:
    rgba(0,0,0,0.92);

    justify-content:center;
    align-items:center;

    backdrop-filter:blur(8px);
}

/* MODAL IMAGE */

.modal-img{

    max-width:90%;
    max-height:85%;

    border-radius:18px;

    animation:zoomIn 0.4s ease;
}

/* CLOSE */

.close{

    position:absolute;

    top:30px;
    right:40px;

    font-size:45px;

    color:white;

    cursor:pointer;
}

/* ANIMATIONS */

@keyframes zoomIn{

    from{

        transform:scale(0.7);
        opacity:0;
    }

    to{

        transform:scale(1);
        opacity:1;
    }
}

@keyframes fadeUp{

    from{

        opacity:0;

        transform:
        translateY(50px);
    }

    to{

        opacity:1;

        transform:
        translateY(0);
    }
}

/* RESPONSIVE */

@media(max-width:768px){

    .gallery-title{

        font-size:36px;
    }

    .wide{

        grid-column:span 1;
    }

}
</style>
